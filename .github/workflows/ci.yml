name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded pull request runs are cancelled. Every other run has a group of
# its own, so pushed commits and releases never wait for or replace each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-platforms:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          set-host: true
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Check real multi-platform inspection and export
        env:
          SALTY_ACTIONS_DOCKER_TEST: '1'
        run: python3 -m unittest tests.test_container_platforms -v

  # Organization IP allow lists apply to authenticated requests from these
  # runners, so the scanners must install and scan with the workflow token in
  # the environment, as in a calling workflow, without ever using it.
  scanner-downloads:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      # alpine:3.22, pinned by its multi-platform index digest.
      SCAN_IMAGE: alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          set-host: true
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Install the pinned scanner releases anonymously
        env:
          SALTY_NETWORK_TESTS: '1'
        run: python3 -m unittest tests.test_scanner_downloads -v

      - name: Pull a small public image
        run: docker pull --platform linux/amd64 "$SCAN_IMAGE"

      - name: Scan the image with Trivy
        id: scan
        uses: ./container-scan
        with:
          image: ${{ env.SCAN_IMAGE }}
          name: alpine
          platform: linux/amd64
          output-directory: ${{ runner.temp }}/container-scan
          # Scout needs Docker Hub credentials, which this repository's CI
          # does not hold; the network test above covers its installation.
          scout-enabled: 'false'
          enforce-kev: 'false'

      - name: Require a complete Trivy scan with a downloaded database
        env:
          REPORT_DIRECTORY: ${{ steps.scan.outputs.report-directory }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["REPORT_DIRECTORY"])
          report = json.loads((directory / "report.json").read_text())
          trivy = json.loads((directory / "trivy.json").read_text())
          database = report["provenance"]["trivy_database"] or {}
          print(json.dumps(
              {
                  "scanners": report["scanners"],
                  "errors": report["errors"],
                  "trivy_database": database,
                  "os": trivy["Metadata"]["OS"],
                  "findings": len(report["findings"]),
              },
              indent=2,
          ))
          problems = [
              error for error in report["errors"] if not error.startswith("Scout")
          ]
          if report["scanners"].get("trivy") != "complete":
              problems.append("Trivy scan did not complete")
          if not database.get("DownloadedAt"):
              problems.append("Trivy database was not downloaded")
          if trivy["Metadata"]["OS"]["Family"] != "alpine":
              problems.append("Trivy did not analyse the alpine image")
          for problem in problems:
              print(f"::error::{problem}")
          raise SystemExit(1 if problems else 0)
          PYTHON

  # The oldest and newest supported Python releases.
  python-bounds:
    name: python-bounds (${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.10'
          - '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Record Python version
        run: python3 -VV

      - name: Run unit tests with warnings as errors
        env:
          PYTHONWARNINGS: error
          PYTHONDEVMODE: '1'
        run: |
          set -o pipefail
          python3 -W error -X dev -m unittest discover -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # Leaks found during garbage collection are reported, not raised.
          if grep -nE 'Exception ignored|[A-Za-z]+Warning: ' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::Python reported warnings or unraisable exceptions"
            exit 1
          fi

      - name: Compile Python modules with warnings as errors
        run: python3 -W error -X dev -m compileall -q -f src tests

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The actions run on the runner's own python3, so it is tested as well
      # as the supported bounds below.
      - name: Record Python version
        run: python3 -VV

      - name: Run unit tests with warnings as errors
        env:
          PYTHONWARNINGS: error
          PYTHONDEVMODE: '1'
        run: |
          set -o pipefail
          python3 -W error -X dev -m unittest discover -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # Leaks found during garbage collection are reported, not raised.
          if grep -nE 'Exception ignored|[A-Za-z]+Warning: ' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::Python reported warnings or unraisable exceptions"
            exit 1
          fi

      - name: Compile Python modules with warnings as errors
        run: python3 -W error -X dev -m compileall -q -f src tests

      - name: Check Bash syntax
        run: |
          bash -n saltbox-lint/install.sh
          bash -n saltbox-lint/run.sh
          bash -n jactionlint/install.sh
          bash -n jactionlint/run.sh

      - name: Validate actions and workflows
        uses: ./jactionlint
        with:
          files: |
            .github/workflows/ci.yml
            .github/workflows/release.yml
            .github/workflows/runner-images.yml
            tests/actionlint/actions.yml
            tests/actionlint/organization-policy.yml

      # The packaged organization config must stay strict for other owners.
      - name: Check an unpinned third-party action
        id: unpinned
        continue-on-error: true
        uses: ./jactionlint
        with:
          files: tests/actionlint/unpinned-action.yml

      - name: Require the unpinned action to be rejected
        if: steps.unpinned.outcome != 'failure'
        run: exit 1

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$base_sha" HEAD
