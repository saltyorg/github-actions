name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A release in progress is never cancelled; a repeated run for the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The notes list every commit since the previous release tag, so the
      # checkout needs the full history and every tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python3 -m salty_actions.release_notes --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
