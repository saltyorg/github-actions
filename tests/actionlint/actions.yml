name: Local action contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: retry
        uses: ./retry
        with:
          github-token: fixture-token
          non-retryable-jobs: saltbox-lint

      - uses: ./notify
        with:
          github-token: fixture-token
          discord-webhook: https://discord.invalid/api/webhooks/fixture
          terminal-reason: ${{ steps.retry.outputs.reason }}
          execution-attempt: ${{ steps.retry.outputs.execution-attempt }}

      - uses: ./notify
        with:
          github-token: fixture-token
          discord-webhook: https://discord.invalid/api/webhooks/fixture
          notification-artifact: notification-1

      - uses: ./saltbox-lint
        with:
          version: v1.2.3
          working-directory: .
          paths: |
            roles/saltbox/tasks/main.yml
            roles/sandbox/tasks/main.yml

      - uses: ./container-scan
        with:
          image: local/example:candidate
          name: example
          platform: linux/amd64
          output-directory: security/example-amd64

      - uses: ./container-report
        with:
          reports-directory: security
          expected-targets: expected-targets.json
          scope: example

      - uses: ./container-snapshot
        with:
          targets: '[{"name":"example","platform":"linux/amd64","image":"example/image:latest"}]'
