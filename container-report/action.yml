name: Report container vulnerabilities
description: Reconcile CVE issues from complete current published-image reports
inputs:
  reports-directory:
    description: Directory containing downloaded per-target report.json files
    required: true
  expected-targets:
    description: JSON file declaring name, platform, image digest, and tracking_reference for every target
    required: true
  scope:
    description: Stable identifier for the entire published image set managed by this job
    required: true
  github-token:
    description: Repository token with Issues read permission, or write permission when dry-run is false
    default: ${{ github.token }}
  dry-run:
    description: Propose issue operations without performing any writes
    default: 'true'
  output:
    description: Path for the aggregate JSON result and proposed or applied operations
    default: container-security-report.json
outputs:
  report-path:
    description: Absolute aggregate report path
    value: ${{ steps.report.outputs.report-path }}
  report-status:
    description: complete or incomplete
    value: ${{ steps.report.outputs.report-status }}
runs:
  using: composite
  steps:
    - name: Reconcile vulnerability issue reports
      id: report
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECURITY_REPORTS: ${{ inputs.reports-directory }}
        SECURITY_EXPECTED_TARGETS: ${{ inputs.expected-targets }}
        SECURITY_SCOPE: ${{ inputs.scope }}
        SECURITY_DRY_RUN: ${{ inputs.dry-run }}
        SECURITY_REPORT_OUTPUT: ${{ inputs.output }}
      run: PYTHONPATH="$GITHUB_ACTION_PATH/../src" python3 -m salty_actions.container_report
